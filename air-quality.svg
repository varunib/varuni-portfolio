<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f7f3eb"/>
  <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#171717" stroke-width="0.5" stroke-opacity="0.15"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid3)"/>
  <rect x="50" y="40" width="700" height="370" rx="6" fill="#fffdf8" stroke="#171717" stroke-width="3"/>
  <rect x="50" y="40" width="700" height="40" fill="#ffc9a9" stroke="#171717" stroke-width="3"/>
  <circle cx="75" cy="60" r="6" fill="#ff5f56" stroke="#171717" stroke-width="1.5"/>
  <circle cx="95" cy="60" r="6" fill="#ffbd2e" stroke="#171717" stroke-width="1.5"/>
  <circle cx="115" cy="60" r="6" fill="#27c93f" stroke="#171717" stroke-width="1.5"/>
  <text x="400" y="65" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#171717" text-anchor="middle">air-quality-dashboard // React + Node.js + Open-Meteo API</text>

  <!-- Metric Panels -->
  <g transform="translate(80, 110)">
    <rect width="180" height="85" rx="4" fill="#b8f2d0" stroke="#171717" stroke-width="2"/>
    <text x="90" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#171717" text-anchor="middle">BENGALURU AQI</text>
    <text x="90" y="62" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#171717" text-anchor="middle">84</text>
    <text x="90" y="77" font-family="'Segoe UI', sans-serif" font-size="10" fill="#171717" text-anchor="middle">Moderate Air Quality</text>
  </g>

  <g transform="translate(285, 110)">
    <rect width="180" height="85" rx="4" fill="#ffc9a9" stroke="#171717" stroke-width="2"/>
    <text x="90" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#171717" text-anchor="middle">PM 2.5 LEVEL</text>
    <text x="90" y="62" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#171717" text-anchor="middle">28.4</text>
    <text x="90" y="77" font-family="'Segoe UI', sans-serif" font-size="10" fill="#171717" text-anchor="middle">&mu;g/m&sup3; &middot; 24h Average</text>
  </g>

  <g transform="translate(490, 110)">
    <rect width="230" height="85" rx="4" fill="#d8c8ff" stroke="#171717" stroke-width="2"/>
    <text x="115" y="32" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#171717" text-anchor="middle">ML FORECAST ENGINE</text>
    <text x="115" y="62" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#171717" text-anchor="middle">24-48 HR</text>
    <text x="115" y="77" font-family="'Segoe UI', sans-serif" font-size="10" fill="#171717" text-anchor="middle">Time-Series Predictive Model</text>
  </g>

  <!-- Chart Preview -->
  <g transform="translate(80, 220)">
    <rect width="640" height="120" rx="4" fill="#f7f3eb" stroke="#171717" stroke-width="2"/>
    <polyline points="20,95 80,75 140,82 200,60 260,65 320,40 380,50 440,30 500,45 560,25 620,35" fill="none" stroke="#171717" stroke-width="3.5"/>
    <circle cx="620" cy="35" r="5" fill="#10b981" stroke="#171717" stroke-width="2"/>
    <text x="20" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#171717">Trend Line: Multi-City Air Quality Index (Open-Meteo Integration)</text>
  </g>

  <rect x="230" y="360" width="340" height="34" rx="3" fill="#171717"/>
  <text x="400" y="383" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#fffdf8" text-anchor="middle">Live Dashboard Mockup &bull; Click to Expand</text>
</svg>