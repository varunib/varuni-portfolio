<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f7f3eb"/>
  <pattern id="grid-voice" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#171717" stroke-width="0.5" stroke-opacity="0.12"/>
  </pattern>
  <rect width="800" height="480" fill="url(#grid-voice)"/>

  <!-- Main App Window Frame -->
  <rect x="35" y="25" width="730" height="430" rx="4" fill="#fffdf8" stroke="#171717" stroke-width="2.5"/>
  
  <!-- Window Header Bar -->
  <rect x="35" y="25" width="730" height="38" rx="4" fill="#d8c8ff" stroke="#171717" stroke-width="2.5"/>
  <circle cx="55" cy="44" r="5" fill="#ff5f56" stroke="#171717" stroke-width="1.2"/>
  <circle cx="70" cy="44" r="5" fill="#ffbd2e" stroke="#171717" stroke-width="1.2"/>
  <circle cx="85" cy="44" r="5" fill="#27c93f" stroke="#171717" stroke-width="1.2"/>
  <text x="400" y="49" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#171717" text-anchor="middle">VoiceAI Assistant &bull; Live Conversation &amp; Task Agent</text>

  <!-- Left Sidebar (Conversations & Integrations) -->
  <g transform="translate(50, 75)">
    <rect width="180" height="360" rx="3" fill="#f4efe4" stroke="#171717" stroke-width="2"/>
    <text x="14" y="26" font-family="'Segoe UI', sans-serif" font-weight="850" font-size="11" fill="#171717" text-transform="uppercase" letter-spacing="0.05em">Active Sessions</text>
    
    <!-- Session 1 Active -->
    <rect x="10" y="38" width="160" height="42" rx="3" fill="#b8f2d0" stroke="#171717" stroke-width="1.5"/>
    <text x="20" y="56" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#171717">Calendar &amp; Tasks</text>
    <text x="20" y="70" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#374151">2 mins ago &middot; 4 actions</text>

    <!-- Session 2 -->
    <rect x="10" y="88" width="160" height="40" rx="3" fill="#fffdf8" stroke="#171717" stroke-width="1.2"/>
    <text x="20" y="106" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10.5" fill="#171717">Weekly Sprint Notes</text>
    <text x="20" y="119" font-family="'Segoe UI', sans-serif" font-size="9" fill="#6b7280">Yesterday &middot; Supabase</text>

    <!-- Integration Badges at bottom of sidebar -->
    <rect x="10" y="260" width="160" height="90" rx="3" fill="#fffdf8" stroke="#171717" stroke-width="1.5"/>
    <text x="18" y="280" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10" fill="#171717">CONNECTED APIS</text>
    
    <circle cx="24" cy="300" r="4" fill="#10b981"/>
    <text x="34" y="303" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#171717">Google Calendar (OAuth)</text>

    <circle cx="24" cy="318" r="4" fill="#10b981"/>
    <text x="34" y="321" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#171717">Supabase DB (Live)</text>

    <circle cx="24" cy="336" r="4" fill="#10b981"/>
    <text x="34" y="339" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#171717">OpenAI Whisper v3</text>
  </g>

  <!-- Main Chat & Voice Interface -->
  <g transform="translate(242, 75)">
    <!-- Top Audio Waveform Bar -->
    <rect width="508" height="52" rx="3" fill="#ffc9a9" stroke="#171717" stroke-width="2"/>
    <circle cx="24" cy="26" r="10" fill="#ff5f56" stroke="#171717" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="4" fill="#ffffff"/>
    <text x="44" y="24" font-family="'Segoe UI', sans-serif" font-weight="850" font-size="11" fill="#171717">LIVE AUDIO INPUT</text>
    <text x="44" y="38" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#374151">Listening via WebRTC &bull; Sample rate 44.1kHz</text>

    <!-- Stylized Sound Wave -->
    <g transform="translate(260, 15)">
      <rect x="0" y="8" width="4" height="18" rx="2" fill="#171717"/>
      <rect x="8" y="4" width="4" height="26" rx="2" fill="#171717"/>
      <rect x="16" y="1" width="4" height="32" rx="2" fill="#171717"/>
      <rect x="24" y="6" width="4" height="22" rx="2" fill="#171717"/>
      <rect x="32" y="10" width="4" height="14" rx="2" fill="#171717"/>
      <rect x="40" y="2" width="4" height="30" rx="2" fill="#171717"/>
      <rect x="48" y="0" width="4" height="34" rx="2" fill="#171717"/>
      <rect x="56" y="5" width="4" height="24" rx="2" fill="#171717"/>
      <rect x="64" y="10" width="4" height="14" rx="2" fill="#171717"/>
      <rect x="72" y="3" width="4" height="28" rx="2" fill="#171717"/>
      <rect x="80" y="7" width="4" height="20" rx="2" fill="#171717"/>
      <rect x="88" y="11" width="4" height="12" rx="2" fill="#171717"/>
      <rect x="96" y="2" width="4" height="30" rx="2" fill="#171717"/>
      <rect x="104" y="6" width="4" height="22" rx="2" fill="#171717"/>
      <rect x="112" y="9" width="4" height="16" rx="2" fill="#171717"/>
      <rect x="120" y="12" width="4" height="10" rx="2" fill="#171717"/>
    </g>

    <rect x="410" y="12" width="86" height="28" rx="2" fill="#171717"/>
    <text x="453" y="30" font-family="'Segoe UI', sans-serif" font-weight="750" font-size="10.5" fill="#ffffff" text-anchor="middle">Whisper Active</text>

    <!-- User Speech Transcript Bubble -->
    <g transform="translate(140, 68)">
      <rect width="368" height="52" rx="4" fill="#d8c8ff" stroke="#171717" stroke-width="2"/>
      <text x="14" y="20" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10" fill="#49247a">USER (VOICE)</text>
      <text x="14" y="38" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#171717">"Schedule a project sync with Sarah tomorrow at 3 PM."</text>
    </g>

    <!-- AI Assistant Response Card -->
    <g transform="translate(0, 134)">
      <rect width="470" height="146" rx="4" fill="#b8f2d0" stroke="#171717" stroke-width="2"/>
      <text x="16" y="22" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10.5" fill="#065f46">ASSISTANT (GPT-4o-mini)</text>
      <text x="16" y="42" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#171717">I've added the event to your Google Calendar:</text>
      
      <!-- Event Ticket / Calendar Card Embedded -->
      <g transform="translate(16, 54)">
        <rect width="438" height="74" rx="3" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="74" rx="3" fill="#7955b8"/>
        <text x="20" y="24" font-family="'Segoe UI', sans-serif" font-weight="850" font-size="13" fill="#171717">Project Sync w/ Sarah</text>
        <text x="20" y="43" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#374151">&#128197; Tomorrow, 3:00 PM &ndash; 3:30 PM &middot; Google Meet</text>
        <text x="20" y="60" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#059669">&#10003; Calendar Event Created &amp; Synced to Supabase</text>
        
        <rect x="330" y="20" width="94" height="32" rx="2" fill="#171717"/>
        <text x="377" y="40" font-family="'Segoe UI', sans-serif" font-weight="750" font-size="10.5" fill="#ffffff" text-anchor="middle">View Event &rarr;</text>
      </g>
    </g>

    <!-- Bottom Action Bar -->
    <g transform="translate(0, 294)">
      <rect width="508" height="66" rx="3" fill="#fffdf8" stroke="#171717" stroke-width="2"/>
      <circle cx="34" cy="33" r="18" fill="#10b981" stroke="#171717" stroke-width="2"/>
      <path d="M 34 23 L 34 37 M 27 30 L 34 23 L 41 30" stroke="#171717" stroke-width="2.5" fill="none"/>
      <text x="64" y="28" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#171717">Ask anything or give a command...</text>
      <text x="64" y="44" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6b7280">Latency: 280ms &bull; Whisper STT + GPT-4o-mini + Supabase Vector</text>

      <rect x="420" y="18" width="76" height="30" rx="2" fill="#d8c8ff" stroke="#171717" stroke-width="1.5"/>
      <text x="458" y="37" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10.5" fill="#171717" text-anchor="middle">&#127911; Speak</text>
    </g>
  </g>
</svg>