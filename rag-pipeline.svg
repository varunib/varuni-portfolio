<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f7f3eb"/>
  <pattern id="grid-rag" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#171717" stroke-width="0.5" stroke-opacity="0.12"/>
  </pattern>
  <rect width="800" height="480" fill="url(#grid-rag)"/>

  <!-- Main App Window Frame -->
  <rect x="35" y="25" width="730" height="430" rx="4" fill="#fffdf8" stroke="#171717" stroke-width="2.5"/>
  
  <!-- Window Header Bar -->
  <rect x="35" y="25" width="730" height="38" rx="4" fill="#b8f2d0" stroke="#171717" stroke-width="2.5"/>
  <circle cx="55" cy="44" r="5" fill="#ff5f56" stroke="#171717" stroke-width="1.2"/>
  <circle cx="70" cy="44" r="5" fill="#ffbd2e" stroke="#171717" stroke-width="1.2"/>
  <circle cx="85" cy="44" r="5" fill="#27c93f" stroke="#171717" stroke-width="1.2"/>
  <text x="400" y="49" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#171717" text-anchor="middle">RAG Document Q&amp;A Workspace &bull; FastAPI + ChromaDB + LangGraph</text>

  <!-- Left Sidebar (Document Knowledge Base) -->
  <g transform="translate(50, 75)">
    <rect width="200" height="360" rx="3" fill="#f5f0e6" stroke="#171717" stroke-width="2"/>
    <text x="14" y="26" font-family="'Segoe UI', sans-serif" font-weight="850" font-size="11" fill="#171717" text-transform="uppercase" letter-spacing="0.05em">Indexed Documents (3)</text>
    
    <!-- Doc 1 Active -->
    <rect x="10" y="38" width="180" height="50" rx="3" fill="#fffdf8" stroke="#171717" stroke-width="1.5"/>
    <text x="20" y="56" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#171717">&#128196; financial_q3_report.pdf</text>
    <text x="20" y="72" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#059669">142 Chunks &middot; ChromaDB &#10003;</text>

    <!-- Doc 2 -->
    <rect x="10" y="96" width="180" height="50" rx="3" fill="#fffdf8" stroke="#171717" stroke-width="1.2"/>
    <text x="20" y="114" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10.5" fill="#171717">&#128196; aws_cloud_architecture.pdf</text>
    <text x="20" y="130" font-family="'Segoe UI', sans-serif" font-size="9" fill="#374151">88 Chunks &middot; ChromaDB &#10003;</text>

    <!-- Doc 3 -->
    <rect x="10" y="154" width="180" height="50" rx="3" fill="#fffdf8" stroke="#171717" stroke-width="1.2"/>
    <text x="20" y="172" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10.5" fill="#171717">&#128196; api_specifications.md</text>
    <text x="20" y="188" font-family="'Segoe UI', sans-serif" font-size="9" fill="#374151">34 Chunks &middot; ChromaDB &#10003;</text>

    <!-- Add doc button -->
    <rect x="10" y="214" width="180" height="34" rx="3" fill="#ffc9a9" stroke="#171717" stroke-width="1.5"/>
    <text x="100" y="235" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10.5" fill="#171717" text-anchor="middle">+ Upload New Document</text>

    <!-- Vector DB Stats -->
    <g transform="translate(10, 260)">
      <rect width="180" height="90" rx="3" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
      <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-weight="850" font-size="10" fill="#171717">VECTOR ENGINE STATS</text>
      <text x="14" y="42" font-family="'Segoe UI', sans-serif" font-size="10" fill="#374151">Embeddings: text-embed-3</text>
      <text x="14" y="58" font-family="'Segoe UI', sans-serif" font-size="10" fill="#374151">Search: Cosine Similarity</text>
      <text x="14" y="76" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10" fill="#10b981">&#9679; ChromaDB Local Service</text>
    </g>
  </g>

  <!-- Main Q&A Interface -->
  <g transform="translate(265, 75)">
    <!-- User Query Bubble -->
    <g transform="translate(80, 0)">
      <rect width="405" height="48" rx="4" fill="#ffc9a9" stroke="#171717" stroke-width="2"/>
      <text x="14" y="18" font-family="'Segoe UI', sans-serif" font-weight="850" font-size="9.5" fill="#9a3412">USER QUESTION</text>
      <text x="14" y="35" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#171717">"What was the total Q3 cloud spend and how can we optimize it?"</text>
    </g>

    <!-- AI Agent Synthesized Answer -->
    <g transform="translate(0, 58)">
      <rect width="485" height="195" rx="4" fill="#fffdf8" stroke="#171717" stroke-width="2"/>
      <rect x="0" y="0" width="485" height="32" rx="4" fill="#d8c8ff" stroke="#171717" stroke-width="2"/>
      <text x="14" y="21" font-family="'Segoe UI', sans-serif" font-weight="850" font-size="11" fill="#171717">AI AGENT (LangGraph + LLaMA 3 / GPT-4)</text>
      <rect x="375" y="6" width="98" height="20" rx="2" fill="#171717"/>
      <text x="424" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">Retrieved in 162ms</text>

      <text x="16" y="54" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#171717">According to Section 3.2 of <tspan font-weight="800" fill="#7955b8">financial_q3_report.pdf</tspan>:</text>
      <text x="16" y="74" font-family="'Segoe UI', sans-serif" font-size="11" fill="#374151">&bull; Total cloud infrastructure expenditure in Q3 was <tspan font-weight="750" fill="#171717">$48,250</tspan> (AWS EC2 &amp; S3).</text>
      <text x="16" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#374151">&bull; Recommended optimization: transition underutilized staging EC2 to Spot</text>
      <text x="24" y="108" font-family="'Segoe UI', sans-serif" font-size="11" fill="#374151">Instances to reduce monthly billing by an estimated <tspan font-weight="750" fill="#059669">24%</tspan>.</text>

      <!-- Citations Card -->
      <g transform="translate(14, 120)">
        <rect width="457" height="62" rx="3" fill="#f7f3eb" stroke="#171717" stroke-width="1.5"/>
        <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="9.5" fill="#171717">RETRIEVED CITATIONS (Top Cosine Matches):</text>
        
        <rect x="12" y="26" width="210" height="26" rx="2" fill="#b8f2d0" stroke="#171717" stroke-width="1.2"/>
        <text x="18" y="42" font-family="'Segoe UI', sans-serif" font-weight="750" font-size="9.5" fill="#171717">&#128269; Page 14, Chunk #42 &middot; 94.2% match</text>

        <rect x="232" y="26" width="210" height="26" rx="2" fill="#fffdf8" stroke="#171717" stroke-width="1.2"/>
        <text x="238" y="42" font-family="'Segoe UI', sans-serif" font-weight="750" font-size="9.5" fill="#171717">&#128269; Page 18, Chunk #57 &middot; 89.1% match</text>
      </g>
    </g>

    <!-- Query Input Bar -->
    <g transform="translate(0, 264)">
      <rect width="485" height="96" rx="3" fill="#fffdf8" stroke="#171717" stroke-width="2"/>
      <rect x="12" y="14" width="461" height="42" rx="2" fill="#f7f3eb" stroke="#171717" stroke-width="1.5"/>
      <text x="24" y="39" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Ask a question across your indexed documents...</text>
      
      <rect x="390" y="20" width="75" height="30" rx="2" fill="#171717"/>
      <text x="427" y="39" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10.5" fill="#ffffff" text-anchor="middle">Query &rarr;</text>

      <text x="14" y="78" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#374151">Tech Stack: FastAPI Async REST API &bull; LangChain &bull; ChromaDB Vector &bull; Docker on AWS</text>
    </g>
  </g>
</svg>